<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Счета и акты</title>
<meta name="theme-color" content="#1f5fbf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --text:#1b2330; --muted:#6b7686; --line:#dde3ec;
  --accent:#1f5fbf; --accent-2:#e8f0fc; --danger:#c62828; --ok:#2e7d32;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:12px 16px calc(12px);padding-top:max(12px,env(safe-area-inset-top))}
header.top h1{margin:0;font-size:18px;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:48px;z-index:4;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:12px 12px;white-space:nowrap;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:17px}
.card h3{margin:16px 0 8px;font-size:15px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.sum-input{font-size:22px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn:hover{background:#f7f9fc}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{width:100%;padding:14px;font-size:16px;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger.confirm{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}
.check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text)}
.check input{width:20px;height:20px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.item .info{flex:1;min-width:180px}
.item .title{font-weight:600}
.item .meta{font-size:13px;color:var(--muted)}
.item .amt{font-weight:600;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:32px 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2330;color:#fff;padding:10px 16px;border-radius:8px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.words{background:var(--accent-2);border-radius:8px;padding:8px 12px;font-size:14px;margin-top:8px}
.result{border-left:4px solid var(--ok)}

/* Document viewer */
#viewer{display:none;position:fixed;inset:0;background:#5d6673;z-index:20;overflow:auto}
#viewer.open{display:block}
.vbar{position:sticky;top:0;background:#2a313c;color:#fff;display:flex;gap:8px;padding:10px 12px;align-items:center;z-index:2;padding-top:max(10px,env(safe-area-inset-top))}
.vbar .sp{flex:1;font-size:14px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .btn{background:#3b4452;color:#fff;border-color:#4b5563}
.vbar .btn.primary{background:var(--accent);border-color:var(--accent)}
.sheet-wrap{padding:16px;overflow-x:auto}
.sheet{background:#fff;color:#000;width:210mm;min-height:297mm;margin:0 auto;padding:12mm 12mm 14mm;box-shadow:0 4px 24px rgba(0,0,0,.35)}

/* Document typography */
.doc{font:11px/1.3 Arial,"Helvetica Neue",sans-serif;color:#000}
.doc table{border-collapse:collapse;width:100%}
.doc td,.doc th{padding:3px 4px;vertical-align:top}
.doc .b td,.doc .b th,.doc td.b,.doc th.b{border:1px solid #000}
.doc .bold{font-weight:bold}
.doc .c{text-align:center}
.doc .r{text-align:right}
.doc .small{font-size:9px}
.doc .h1{font-size:16px;font-weight:bold;margin:14px 0 4px}
.doc .rule{border-bottom:2px solid #000;margin:4px 0 8px}
.doc .warn{font-size:9.5px;text-align:center;margin-bottom:10px}
.doc .num{white-space:nowrap}
.doc .sign{margin-top:28px}
.doc .line{display:inline-block;border-bottom:1px solid #000;min-width:120px;height:14px;vertical-align:bottom}
.doc .cap{font-size:8.5px;text-align:center;color:#000}
.doc .gap{height:10px}

@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  header.top,nav.tabs,main,.vbar,.toast{display:none!important}
  #viewer{display:block!important;position:static;background:#fff;overflow:visible}
  .sheet-wrap{padding:0;overflow:visible}
  .sheet{box-shadow:none;margin:0;width:210mm;min-height:auto}
}
@media (max-width:820px){
  .sheet-wrap{padding:8px}
}
</style>
</head>
<body>
<header class="top"><h1>Счета и акты</h1></header>
<nav class="tabs" id="tabs">
  <button data-tab="create" class="active">➕ Создать</button>
  <button data-tab="invoices">Счета на оплату</button>
  <button data-tab="acts">Акты выполненных работ</button>
  <button data-tab="buyers">Покупатели</button>
  <button data-tab="settings">Настройки</button>
</nav>
<main id="main"></main>

<div id="viewer">
  <div class="vbar">
    <button class="btn" id="vClose">← Назад</button>
    <span class="sp" id="vTitle"></span>
    <button class="btn primary" id="vPrint">🖨 Печать / PDF</button>
  </div>
  <div class="sheet-wrap"><div class="sheet" id="sheet"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= Storage ================= */
const KEY = 'scheta-data-v1';
const DEFAULTS = () => ({
  seller:{name:'',bin:'',address:'',iik:'',bank:'',bik:'',kbe:'19',knp:'859',director:'',contract:'Без договора'},
  service:{name:'Услуги',unit:'усл.'},
  nextInv:1, nextAct:1,
  vat:false, vatRate:12,
  buyers:[], docs:[], seeded:[]
});
// Встроенные покупатели: добавляются один раз на каждом устройстве (после удаления не возвращаются)
const PRESET_BUYERS = [
  {id:'mwf3kltkdxefx', name:'ТОО "Bolashak Electric"', bin:'180540012393', director:'Тулебаев Канат Канашевич',
   address:'Республика Казахстан, город Астана, район Алматы, проспект Әл-Фараби, здание 97/3', contract:''}
];
function seedBuyers(d){
  let changed=false;
  for(const p of PRESET_BUYERS){
    if(d.seeded.includes(p.id)) continue;
    if(!d.buyers.some(b=>b.id===p.id||(p.bin&&b.bin===p.bin))) d.buyers.push(Object.assign({},p));
    d.seeded.push(p.id); changed=true;
  }
  return changed;
}
function load(){
  let d = DEFAULTS();
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); d = merge(d,p); }
  }catch(e){ console.warn(e); }
  return d;
}
function merge(def,p){
  const d = Object.assign({},def,p||{});
  d.seller = Object.assign({},def.seller,(p||{}).seller);
  d.service = Object.assign({},def.service,(p||{}).service);
  if(!Array.isArray(d.buyers)) d.buyers=[];
  if(!Array.isArray(d.docs)) d.docs=[];
  if(!Array.isArray(d.seeded)) d.seeded=[];
  d.nextInv = +d.nextInv||1; d.nextAct = +d.nextAct||1;
  d.vatRate = +d.vatRate||0; d.vat = !!d.vat;
  return d;
}
let S = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Не удалось сохранить данные: '+e.message); }
}
if(seedBuyers(S)) save();

/* ================= Helpers ================= */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function dateLong(iso){ const [y,m,d]=iso.split('-'); return `${+d} ${MONTHS[+m-1]} ${y} г.`; }
function dateShort(iso){ const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }
function parseSum(s){
  s = String(s||'').replace(/[\s ₸]/g,'').replace(',', '.');
  if(!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s)*100)/100;
}
function money(n){
  const neg = n<0; n=Math.abs(n);
  const [i,f] = n.toFixed(2).split('.');
  return (neg?'-':'') + i.replace(/\B(?=(\d{3})+(?!\d))/g,' ') + ',' + f;
}
function vatAmount(sum,rate){ return Math.round(sum*rate/(100+rate)*100)/100; }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

/* ================= Amount in words ================= */
const W = {
  onesM:['','один','два','три','четыре','пять','шесть','семь','восемь','девять'],
  onesF:['','одна','две','три','четыре','пять','шесть','семь','восемь','девять'],
  teens:['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'],
  tens:['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'],
  hund:['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот']
};
function plural(n,forms){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return forms[2]; if(n1===1) return forms[0]; if(n1>=2&&n1<=4) return forms[1]; return forms[2]; }
function triad(n,fem){
  const out=[]; const h=Math.floor(n/100), t=Math.floor(n%100/10), o=n%10;
  if(h) out.push(W.hund[h]);
  if(t===1) out.push(W.teens[o]);
  else { if(t) out.push(W.tens[t]); if(o) out.push((fem?W.onesF:W.onesM)[o]); }
  return out.join(' ');
}
function numToWords(n){
  n=Math.floor(n);
  if(n===0) return 'ноль';
  const groups=[
    {fem:false,forms:null},
    {fem:true, forms:['тысяча','тысячи','тысяч']},
    {fem:false,forms:['миллион','миллиона','миллионов']},
    {fem:false,forms:['миллиард','миллиарда','миллиардов']},
    {fem:false,forms:['триллион','триллиона','триллионов']}
  ];
  const parts=[]; let i=0;
  while(n>0 && i<groups.length){
    const g=n%1000;
    if(g){ let s=triad(g,groups[i].fem); if(groups[i].forms) s+=' '+plural(g,groups[i].forms); parts.unshift(s); }
    n=Math.floor(n/1000); i++;
  }
  return parts.join(' ');
}
function sumInWords(sum){
  const tenge=Math.floor(sum+1e-9);
  const tiyn=Math.round((sum-tenge)*100);
  const s=numToWords(tenge)+' тенге '+String(tiyn).padStart(2,'0')+' тиын';
  return s.charAt(0).toUpperCase()+s.slice(1);
}

/* ================= Tabs ================= */
let tab='create';
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  tab=b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
  render(); window.scrollTo(0,0);
});
function render(){
  const m=$('#main');
  ({create:renderCreate,invoices:()=>renderDocs('inv'),acts:()=>renderDocs('act'),buyers:renderBuyers,settings:renderSettings})[tab](m);
}

/* ================= Create ================= */
let lastCreated=null;
function renderCreate(m){
  const sellerOk = S.seller.name && S.seller.bin;
  const opts = S.buyers.map(b=>`<option value="${b.id}">${esc(b.name)}${b.bin?' — '+esc(b.bin):''}</option>`).join('');
  m.innerHTML = `
  ${sellerOk?'':`<div class="card" style="border-color:#f0b429;background:#fffaeb">Сначала заполните свои реквизиты во вкладке <b>Настройки</b> — они попадут в документы.</div>`}
  <div class="card">
    <h2>Новый счёт и акт</h2>
    <form id="fCreate" class="grid" autocomplete="off">
      <div class="full">
        <label>Покупатель</label>
        <select id="cBuyer">
          ${opts}
          <option value="__new" ${S.buyers.length?'':'selected'}>+ Новый покупатель…</option>
        </select>
      </div>
      <div class="full grid" id="newBuyer" style="display:none">
        <div class="full"><label>Название покупателя *</label><input type="text" id="nbName" placeholder='ТОО "Компания"'></div>
        <div><label>БИН/ИИН</label><input type="text" id="nbBin" inputmode="numeric" maxlength="12"></div>
        <div><label>Адрес</label><input type="text" id="nbAddr"></div>
      </div>
      <div class="full">
        <label>Сумма, ₸ *</label>
        <input type="text" id="cSum" class="sum-input" inputmode="decimal" placeholder="150 000">
        <div class="words" id="cWords" style="display:none"></div>
      </div>
      <div><label>Дата</label><input type="date" id="cDate" value="${todayISO()}"></div>
      <div><label>Наименование услуги</label><input type="text" id="cService" value="${esc(S.service.name)}"></div>
      <div><label>№ счёта</label><input type="number" id="cInv" min="1" value="${S.nextInv}"></div>
      <div><label>№ акта</label><input type="number" id="cAct" min="1" value="${S.nextAct}"></div>
      <div class="full"><button class="btn primary big" type="submit">Создать счёт и акт</button></div>
    </form>
  </div>
  <div id="createResult"></div>`;
  const sel=$('#cBuyer'), nb=$('#newBuyer');
  const syncNb=()=>{ nb.style.display = sel.value==='__new'?'grid':'none'; };
  sel.addEventListener('change',syncNb); syncNb();
  $('#cSum').addEventListener('input',e=>{
    const v=parseSum(e.target.value), w=$('#cWords');
    if(isNaN(v)||!e.target.value.trim()){ w.style.display='none'; return; }
    w.style.display='block'; w.textContent=money(v)+' ₸ — '+sumInWords(v);
  });
  $('#fCreate').addEventListener('submit',e=>{ e.preventDefault(); createDocs(); });
  if(lastCreated) showResult(lastCreated);
}
function createDocs(){
  const sum=parseSum($('#cSum').value);
  if(isNaN(sum)||sum<=0){ toast('Введите корректную сумму'); $('#cSum').focus(); return; }
  let buyer;
  if($('#cBuyer').value==='__new'){
    const name=$('#nbName').value.trim();
    if(!name){ toast('Укажите название покупателя'); $('#nbName').focus(); return; }
    buyer={id:uid(),name,bin:$('#nbBin').value.trim(),address:$('#nbAddr').value.trim(),contract:'',director:''};
    S.buyers.push(buyer);
  } else buyer=S.buyers.find(b=>b.id===$('#cBuyer').value);
  if(!buyer){ toast('Выберите покупателя'); return; }
  const invNo=parseInt($('#cInv').value,10), actNo=parseInt($('#cAct').value,10);
  if(!(invNo>0)||!(actNo>0)){ toast('Проверьте номера документов'); return; }
  const doc={
    id:uid(), date:$('#cDate').value||todayISO(), sum,
    service:$('#cService').value.trim()||S.service.name||'Услуги', unit:S.service.unit||'усл.',
    invNo, actNo, vat:S.vat, vatRate:S.vatRate,
    seller:Object.assign({},S.seller), buyer:Object.assign({},buyer),
    created:new Date().toISOString()
  };
  S.docs.unshift(doc);
  S.nextInv=Math.max(S.nextInv,invNo+1);
  S.nextAct=Math.max(S.nextAct,actNo+1);
  save();
  lastCreated=doc.id;
  toast(`Созданы счёт № ${invNo} и акт № ${actNo}`);
  render();
  $('#createResult').scrollIntoView({behavior:'smooth',block:'center'});
}
function showResult(id){
  const d=S.docs.find(x=>x.id===id); if(!d){ lastCreated=null; return; }
  $('#createResult').innerHTML=`
  <div class="card result">
    <h2>Готово ✓</h2>
    <div class="meta">${esc(d.buyer.name)} · ${money(d.sum)} ₸ · ${dateShort(d.date)}</div>
    <div class="list" style="margin-top:12px">
      <div class="item"><div class="info"><div class="title">Счёт на оплату № ${d.invNo}</div></div>
        <button class="btn sm" data-open="inv">Открыть</button><button class="btn sm" data-print="inv">Печать / PDF</button></div>
      <div class="item"><div class="info"><div class="title">Акт выполненных работ № ${d.actNo}</div></div>
        <button class="btn sm" data-open="act">Открыть</button><button class="btn sm" data-print="act">Печать / PDF</button></div>
    </div>
  </div>`;
  $('#createResult').onclick=e=>{
    const o=e.target.closest('[data-open]'), p=e.target.closest('[data-print]');
    if(o) openDoc(d.id,o.dataset.open); if(p) openDoc(d.id,p.dataset.print,true);
  };
}

/* ================= Documents lists ================= */
function renderDocs(kind){
  const m=$('#main');
  const isInv=kind==='inv';
  const flag=isInv?'hideInv':'hideAct';
  const docs=S.docs.filter(d=>!d[flag]).slice().sort((a,b)=>(b.date.localeCompare(a.date))||((isInv?b.invNo-a.invNo:b.actNo-a.actNo)));
  const total=docs.reduce((s,d)=>s+d.sum,0);
  m.innerHTML=`<div class="card"><h2>${isInv?'Счета на оплату':'Акты выполненных работ'}</h2>
    <div class="meta" style="color:var(--muted);margin-bottom:12px">${docs.length} шт. · на сумму ${money(total)} ₸</div>
    <div class="list" id="dlist">${docs.length?docs.map(d=>`
      <div class="item" data-id="${d.id}">
        <div class="info"><div class="title">№ ${isInv?d.invNo:d.actNo} от ${dateShort(d.date)}</div>
          <div class="meta">${esc(d.buyer.name)}</div></div>
        <div class="amt">${money(d.sum)} ₸</div>
        <div class="row">
          <button class="btn sm" data-a="open">Открыть</button>
          <button class="btn sm" data-a="print">PDF</button>
          <button class="btn sm danger" data-a="del">Удалить</button>
        </div>
      </div>`).join(''):`<div class="empty">Пока пусто. Создайте документы во вкладке «➕ Создать».</div>`}
    </div></div>`;
  $('#dlist').addEventListener('click',e=>{
    const b=e.target.closest('button[data-a]'); if(!b) return;
    const id=b.closest('[data-id]').dataset.id;
    if(b.dataset.a==='open') openDoc(id,kind);
    else if(b.dataset.a==='print') openDoc(id,kind,true);
    else if(b.dataset.a==='del') confirmBtn(b,()=>{
      const d=S.docs.find(x=>x.id===id); if(!d) return;
      d[flag]=true;
      if(d.hideInv&&d.hideAct) S.docs=S.docs.filter(x=>x.id!==id);
      if(lastCreated===id) lastCreated=null;
      save(); render(); toast('Удалено');
    });
  });
}
function confirmBtn(b,fn){
  if(b.classList.contains('confirm')){ fn(); return; }
  b.classList.add('confirm'); const old=b.textContent; b.textContent='Точно удалить?';
  setTimeout(()=>{ if(b.isConnected){ b.classList.remove('confirm'); b.textContent=old; } },3000);
}

/* ================= Viewer ================= */
function openDoc(id,kind,print){
  const d=S.docs.find(x=>x.id===id); if(!d) return;
  $('#sheet').innerHTML = kind==='inv'?invoiceHTML(d):actHTML(d);
  const title = kind==='inv'?`Счет на оплату № ${d.invNo} от ${dateShort(d.date)}`:`Акт № ${d.actNo} от ${dateShort(d.date)}`;
  $('#vTitle').textContent=title;
  $('#viewer').classList.add('open'); $('#viewer').scrollTop=0;
  document.body.style.overflow='hidden';
  const prevTitle=document.title;
  $('#vPrint').onclick=()=>{ document.title=title+' — '+d.buyer.name; window.print(); document.title=prevTitle; };
  if(print) setTimeout(()=>$('#vPrint').click(),150);
}
function closeViewer(){ $('#viewer').classList.remove('open'); document.body.style.overflow=''; }
$('#vClose').onclick=closeViewer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeViewer(); });

/* ================= Buyers ================= */
let editBuyer=null;
function renderBuyers(m){
  const b=editBuyer?S.buyers.find(x=>x.id===editBuyer)||{}:{};
  m.innerHTML=`
  <div class="card"><h2>${editBuyer?'Редактировать покупателя':'Новый покупатель'}</h2>
    <form id="fBuyer" class="grid" autocomplete="off">
      <div class="full"><label>Название *</label><input type="text" name="name" value="${esc(b.name)}" placeholder='ТОО "Компания"'></div>
      <div><label>БИН/ИИН</label><input type="text" name="bin" inputmode="numeric" maxlength="12" value="${esc(b.bin)}"></div>
      <div><label>Руководитель (для акта)</label><input type="text" name="director" value="${esc(b.director)}" placeholder="Иванов И.И."></div>
      <div class="full"><label>Адрес</label><input type="text" name="address" value="${esc(b.address)}"></div>
      <div class="full"><label>Договор</label><input type="text" name="contract" value="${esc(b.contract)}" placeholder="Если пусто — из настроек: ${esc(S.seller.contract)}"></div>
      <div class="full row"><button class="btn primary" type="submit">${editBuyer?'Сохранить':'Добавить'}</button>
        ${editBuyer?'<button class="btn" type="button" id="bCancel">Отмена</button>':''}</div>
    </form></div>
  <div class="card"><h2>Покупатели (${S.buyers.length})</h2>
    <div class="list" id="blist">${S.buyers.length?S.buyers.map(x=>`
      <div class="item" data-id="${x.id}"><div class="info"><div class="title">${esc(x.name)}</div>
        <div class="meta">${[x.bin&&'БИН/ИИН '+esc(x.bin),esc(x.address)].filter(Boolean).join(' · ')||'—'}</div></div>
        <div class="row"><button class="btn sm" data-a="edit">Изменить</button><button class="btn sm danger" data-a="del">Удалить</button></div>
      </div>`).join(''):'<div class="empty">Покупателей пока нет</div>'}</div></div>`;
  $('#fBuyer').addEventListener('submit',e=>{
    e.preventDefault();
    const f=new FormData(e.target), o={};
    ['name','bin','director','address','contract'].forEach(k=>o[k]=String(f.get(k)||'').trim());
    if(!o.name){ toast('Укажите название'); return; }
    if(editBuyer){ Object.assign(S.buyers.find(x=>x.id===editBuyer),o); toast('Сохранено'); }
    else { S.buyers.push(Object.assign({id:uid()},o)); toast('Покупатель добавлен'); }
    editBuyer=null; save(); render();
  });
  const c=$('#bCancel'); if(c) c.onclick=()=>{ editBuyer=null; render(); };
  $('#blist').addEventListener('click',e=>{
    const btn=e.target.closest('button[data-a]'); if(!btn) return;
    const id=btn.closest('[data-id]').dataset.id;
    if(btn.dataset.a==='edit'){ editBuyer=id; render(); window.scrollTo(0,0); }
    else confirmBtn(btn,()=>{ S.buyers=S.buyers.filter(x=>x.id!==id); if(editBuyer===id) editBuyer=null; save(); render(); toast('Удалено'); });
  });
}

/* ================= Settings ================= */
function renderSettings(m){
  const s=S.seller;
  const f=(k,l,ph='',extra='')=>`<div ${extra}><label>${l}</label><input type="text" name="seller.${k}" value="${esc(s[k])}" placeholder="${esc(ph)}"></div>`;
  m.innerHTML=`
  <form id="fSet">
  <div class="card"><h2>Мои реквизиты (поставщик)</h2>
    <div class="grid">
      ${f('name','Наименование','ИП Иванов И.И.','class="full"')}
      ${f('bin','БИН/ИИН','123456789012')}
      ${f('director','ФИО руководителя','Иванов И.И.')}
      ${f('address','Адрес','г. Алматы, ул. Абая, 1','class="full"')}
      ${f('bank','Банк','АО "Kaspi Bank"','class="full"')}
      ${f('iik','ИИК','KZ00000000000000000')}
      ${f('bik','БИК','CASPKZKA')}
      ${f('kbe','Кбе','19')}
      ${f('knp','КНП (код назначения платежа)','859')}
      ${f('contract','Договор по умолчанию','Без договора','class="full"')}
    </div>
  </div>
  <div class="card"><h2>Документы</h2>
    <div class="grid">
      <div><label>Наименование услуги по умолчанию</label><input type="text" name="service.name" value="${esc(S.service.name)}"></div>
      <div><label>Единица измерения</label><input type="text" name="service.unit" value="${esc(S.service.unit)}"></div>
      <div><label>Следующий № счёта</label><input type="number" min="1" name="nextInv" value="${S.nextInv}"></div>
      <div><label>Следующий № акта</label><input type="number" min="1" name="nextAct" value="${S.nextAct}"></div>
      <div><label class="check"><input type="checkbox" name="vat" ${S.vat?'checked':''}> Плательщик НДС</label></div>
      <div><label>Ставка НДС, %</label><input type="number" min="0" max="100" step="0.01" name="vatRate" value="${S.vatRate}"></div>
    </div>
  </div>
  <button class="btn primary big" type="submit">Сохранить настройки</button>
  </form>
  <div class="card" style="margin-top:16px"><h2>Резервная копия</h2>
    <p class="hint" style="margin-top:0">Все данные хранятся только в этом браузере. Регулярно сохраняйте копию — при очистке данных браузера они пропадут.</p>
    <div class="row"><button class="btn" id="bExport">⬇ Экспорт JSON</button>
      <button class="btn" id="bImport">⬆ Импорт JSON</button>
      <input type="file" id="fileImport" accept=".json,application/json" hidden></div>
  </div>`;
  $('#fSet').addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    for(const [k,v] of fd.entries()){
      if(k.startsWith('seller.')) S.seller[k.slice(7)]=String(v).trim();
      else if(k.startsWith('service.')) S.service[k.slice(8)]=String(v).trim();
    }
    S.nextInv=Math.max(1,parseInt(fd.get('nextInv'),10)||1);
    S.nextAct=Math.max(1,parseInt(fd.get('nextAct'),10)||1);
    S.vat=fd.get('vat')==='on';
    S.vatRate=parseFloat(String(fd.get('vatRate')).replace(',','.'))||0;
    save(); toast('Настройки сохранены');
  });
  $('#bExport').onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`scheta-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $('#bImport').onclick=()=>$('#fileImport').click();
  $('#fileImport').onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result);
        if(!p||typeof p!=='object'||!p.seller) throw new Error('не похоже на резервную копию');
        if(!confirm('Заменить все текущие данные данными из файла?')) return;
        S=merge(DEFAULTS(),p); save(); lastCreated=null; render(); toast('Данные импортированы');
      }catch(err){ toast('Ошибка импорта: '+err.message); }
    };
    r.readAsText(file); e.target.value='';
  };
}

render();

/* ================= PWA ================= */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.warn));
}
